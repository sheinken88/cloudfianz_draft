name: Website language coverage
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build:proposal
      - run: npm run check:i18n
      - run: npm run check:seo
      - run: node --check prototype/dist/app.js
      - run: node --check prototype/dist/analytics.js
      - name: Verify isolated release and preserved preview protection
        run: |
          python3 prototype/package-release.py
          python3 prototype/check-seo.py --release
          python3 prototype/check-seo.py
      - run: git diff --exit-code -- prototype/dist
      - name: Ensure generated locale files are tracked
        run: test -z "$(git ls-files --others --exclude-standard prototype/dist)"
